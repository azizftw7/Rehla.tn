<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rehla.tn — Toute la Tunisie, sur une seule carte</title>
    <meta
      name="description"
      content="Préparez votre déplacement en Tunisie : hébergements, restaurants, activités, événements, transports et guides locaux sur une seule carte."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600..800&family=Readex+Pro:wght@400..600&display=swap"
    />

    <!-- Applique le thème avant le premier affichage (évite un flash du mauvais thème).
         Même logique et même clé que src/hooks/useTheme.js. -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('rehla-theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
